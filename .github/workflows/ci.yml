name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  demo-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install test dependency
        run: python -m pip install --requirement requirements-dev.txt
      - name: Check public files and seed fixtures
        run: |
          python scripts/check_public.py
          python scripts/validate_fixtures.py
      - name: Run fresh-state demo
        run: python scripts/demo_step6.py --json
      - name: Create dedicated test databases
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect('postgresql://postgres:postgres@localhost:5432/postgres', autocommit=True) as connection:
              connection.execute('CREATE DATABASE agent_commerce_security_test')
              connection.execute('CREATE DATABASE agent_commerce_security_eval')
          PY
      - name: Run SQLite and PostgreSQL tests
        env:
          ACS_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/agent_commerce_security_test
        run: python -m unittest discover -s tests -q
      - name: Run fast PostgreSQL security controls
        run: >-
          python scripts/run_security_benchmark.py
          --suite controls --profile smoke --backend postgres
          --postgres-dsn postgresql://postgres:postgres@localhost:5432/agent_commerce_security_eval
          --output ${{ runner.temp }}/security-benchmark-controls.json
