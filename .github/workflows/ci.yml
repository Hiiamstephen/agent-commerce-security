name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  demo-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install test dependency
        run: python -m pip install --requirement requirements-dev.txt
      - name: Start isolated PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          printf 'PGPASSWORD=%s\n' "$password" >> "$GITHUB_ENV"
          docker run --detach --rm --name acs-ci-postgres \
            --env "POSTGRES_PASSWORD=$password" \
            --publish 127.0.0.1:5432:5432 \
            postgres:16-alpine
      - name: Check public files and seed fixtures
        run: |
          python scripts/check_public.py
          python scripts/validate_fixtures.py
      - name: Run fresh-state demo
        run: python scripts/demo_step6.py --json
      - name: Create dedicated test databases
        run: |
          python - <<'PY'
          import psycopg
          import time

          for attempt in range(30):
              try:
                  connection = psycopg.connect('dbname=postgres connect_timeout=1', autocommit=True)
                  break
              except psycopg.OperationalError:
                  if attempt == 29:
                      raise
                  time.sleep(1)
          with connection:
              connection.execute('CREATE DATABASE agent_commerce_security_test')
              connection.execute('CREATE DATABASE agent_commerce_security_eval')
          PY
      - name: Run SQLite and PostgreSQL tests
        env:
          ACS_TEST_POSTGRES_DSN: dbname=agent_commerce_security_test
        run: python -m unittest discover -s tests -q
      - name: Run fast PostgreSQL security controls
        run: >-
          python scripts/run_security_benchmark.py
          --suite controls --profile smoke --backend postgres
          --postgres-dsn dbname=agent_commerce_security_eval
          --output ${{ runner.temp }}/security-benchmark-controls.json
